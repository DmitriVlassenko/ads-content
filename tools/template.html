<!doctype html><html><head><meta charset="utf-8">
<style>*{margin:0;padding:0}html,body{overflow:hidden;background:#000}canvas{display:block}</style></head>
<body><canvas id="out"></canvas>
<script>/*SPEC*/</script>
<script>window.KCONF={W:1080,H:1920,FPS:30,SAMPLES:6,
  palette:{ink:SPEC.pal.ink,paper:SPEC.pal.paper,accent:SPEC.pal.c[0],accentHi:SPEC.pal.c[4],warm:SPEC.pal.c[1],deep:SPEC.pal.c[2],shade:SPEC.pal.ink,mute:[190,180,200],gray:[110,100,130],cool:SPEC.pal.c[2]},
  fonts:{serif:'"Inter"',sans:'"Inter"',mono:'"Inter"'},
  caBase:.6, caHit:7, flash:.18, punch:.035, vignette:.12};</script>
<script src="engine.js"></script>
<script>
const INK=SPEC.pal.ink,PAPER=SPEC.pal.paper,C=SPEC.pal.c,MUTE=[190,180,200];
const [C0,C1,C2,C3,C4]=C;
const F=(w,s)=>`${w} ${s}px "Inter"`;
const IM={};
const loadImgs=Promise.all(Object.entries(SPEC.photos).map(([k,src])=>new Promise(r=>{const i=new Image();i.onload=()=>r();i.onerror=()=>r();i.src=src;IM[k]=i;})));
const fonts=Promise.all(['900 100px "Inter"','800 40px "Inter"','600 40px "Inter"'].map(f=>document.fonts.load(f,'ÄÖäö')));
function photo(g,k,x,y,w,h,zoom=1,px=0,py=0){const im=IM[k],s=Math.max(w/im.width,h/im.height)*zoom,dw=im.width*s,dh=im.height*s;
  g.save();g.beginPath();g.rect(x,y,w,h);g.clip();g.imageSmoothingQuality='high';
  g.drawImage(im,x+(w-dw)/2+px*(dw-w)/2,y+(h-dh)/2+py*(dh-h)/2,dw,dh);g.restore()}
function rr(g,x,y,w,h,r){g.beginPath();g.roundRect(x,y,w,h,r)}
function big(g,str,cx,cy,col,u,o={}){const fit=o.fit||940,max=o.size||320;const L0=lay(str,F(900,100));const size=Math.min(max,100*fit/L0.w);
  const font=F(900,size),L=lay(str,font),x0=cx-L.w/2;g.save();g.font=font;g.textAlign='center';
  L.gl.forEach((q,j)=>{const a=P(u,j*(o.gap??.04),.3);if(a<=0)return;const s=1+(o.k??.9)*(1-ex(a));const x=x0+q.x+q.w/2;
    g.save();g.translate(x,cy);g.rotate((1-ex(a))*(o.rot??.12)*(j%2?1:-1));g.scale(s,s);g.fillStyle=rgb(col,Math.min(1,a*3));g.fillText(q.ch,0,size*.36);g.restore()});g.restore();return size}
const tri=(cx,top,h,hw)=>[[cx,top],[cx-hw,top+h],[cx+hw,top+h],[cx,top]];
function confetti(g,t,n,seed,cols,sp=380){const r=rng(seed);for(let i=0;i<n;i++){const x=r()*W,ph=r()*H,v=sp*(.6+r()),sz=18+r()*34,c=cols[i%cols.length],rot=r()*6+t*(1+r()*3);
  const y=((ph+t*v)%(H+200))-100;g.save();g.translate(x,y);g.rotate(rot);g.fillStyle=rgb(c);rr(g,-sz/2,-sz*.18,sz,sz*.36,6);g.fill();g.restore()}}
const dark=c=>(c[0]*.299+c[1]*.587+c[2]*.114)<150;
const onC=c=>dark(c)?PAPER:INK;
function wipeClip(g,v,p){ // reveal region for photo scenes; v = variant 0..2, p 0..1
  if(v===0){g.beginPath();g.arc(CX,CY+60,lp(0,1500,p),0,TAU)}
  else if(v===1){g.beginPath();const k=lp(-.3,1.3,p)*H;g.moveTo(0,0);g.lineTo(W,0);g.lineTo(W,k+300);g.lineTo(0,k-300);g.closePath()}
  else{g.beginPath();for(let i=0;i<5;i++){const w=W/5,q=cl(p*1.6-i*.12);g.rect(i*w,0,w+1,H*q)}}
  g.clip()}

/* ---- scene factories: (S) => (g,t,u) ---- */
const SC={};
SC.strobe=S=>{const L=S.words.length;return (g,t,u)=>{ // each word occupies its own sub-slot
  const dur=S.b-S.a,sl=dur/L,i=Math.min(L-1,Math.floor(u/sl)),uu=u-i*sl,col=C[(i+S.v)%5],bg=col,fg=onC(bg),mark=dark(bg)?PAPER:INK;
  fillAll(g,bg);g.save();g.translate(CX,CY);g.scale(1+.12*uu/sl,1+.12*uu/sl);g.translate(-CX,-CY);
  for(let k=0;k<7;k++){g.fillStyle=rgb(mark,.14);g.save();g.translate(0,k*330-300+(uu*900)%330);g.rotate(S.v%2?.12:-.12);g.fillRect(-200,0,W+400,90);g.restore()}
  big(g,S.words[i],CX,CY,fg,uu,{size:340,gap:.035});g.restore()}};
SC.hero=S=>{const d=S.b-S.a;return (g,t,u)=>{fillAll(g,C[S.v%5]);
  g.save();wipeClip(g,S.v%3,ex(P(u,0,.55)));
  photo(g,S.photo,0,0,W,H,lp(1.0,1.28,eio(P(u,0,d))),lp(-.1,.18,eio(P(u,0,d)))*(S.v%2?-1:1),.05);
  const gr=g.createLinearGradient(0,H*.55,0,H);gr.addColorStop(0,rgb(INK,0));gr.addColorStop(1,rgb(INK,.8));g.fillStyle=gr;g.fillRect(0,H*.55,W,H*.45);g.restore();
  if(S.icon!==false){const pts=tri(CX,230,300,190),p=ex(P(u,.35,.9));g.save();g.lineCap='round';g.lineJoin='round';drawOn(g,pts,p,PAPER,22,1);
    for(let k=1;k<=5;k++){const yy=230+k*50,hwk=190*k*50/300;drawOn(g,[[CX-hwk,yy],[CX+hwk,yy]],ex(P(u,.7+k*.06,.3)),C[1],9,1)}g.restore()}
  const a=ex(P(u,.7,.5));g.save();g.beginPath();g.rect(0,1380,W,380);g.clip();
  T(g,S.l1,F(900,S.s1||128),CX,1480+(1-a)*160,PAPER,1);
  if(S.l2)T(g,S.l2,F(900,S.s1||128),CX,1620+(1-ex(P(u,.85,.5)))*180,C[1],1);g.restore();
  if(S.sub){const tp=P(u,1.4,.8);T(g,typed(S.sub,tp),F(700,46),CX,1710,PAPER,tp>0?1:0)}}};
SC.counter=S=>{const d=S.b-S.a,bg=C[S.v%5],fg=onC(bg);return (g,t,u)=>{fillAll(g,bg);
  const e=ex(P(u,0,.45));g.save();g.beginPath();g.moveTo(0,0);g.lineTo(W,0);g.lineTo(W,900-(1-e)*900);g.lineTo(0,1060-(1-e)*1060);g.closePath();g.clip();
  photo(g,S.photo,0,0,W,1100,lp(1.05,1.3,eio(P(u,0,d))),lp(.25,-.15,eio(P(u,0,d))),0);g.restore();
  const n=Math.min(S.n,1+Math.floor(P(u,.15,.9)*S.n));big(g,String(n),230,1330,fg,u,{size:620,fit:400,gap:0,k:.5,rot:.05});
  big(g,S.word.toUpperCase(),700,1230,fg,u-.35,{size:150,fit:560,gap:.04});
  if(S.l2)T(g,S.l2,F(800,70),700,1330,fg,ex(P(u,.55,.4)));
  for(let i=0;i<Math.min(S.n,8);i++){const q=stg(u,i,.055,.35);g.fillStyle=rgb(C[(i+1+S.v)%5]);rr(g,60,1520+i*42,(W-120)*q,26,13);g.fill()}
  if(S.foot)T(g,S.foot,F(800,46),CX,1880,fg,ex(P(u,1.0,.4)))}};
SC.card=S=>{const d=S.b-S.a,bg=C[S.v%5],fg=onC(bg),acc=fg;return (g,t,u)=>{fillAll(g,bg);
  const sl=spr(P(u,0,.6),6,10);g.save();g.translate(CX,620);g.rotate(lp(S.v%2?.35:-.35,S.v%2?.05:-.05,sl));g.translate(0,(1-ex(P(u,0,.4)))*-800);
  g.shadowColor='rgba(0,0,0,.3)';g.shadowBlur=40;g.shadowOffsetY=24;g.fillStyle='#fff';rr(g,-450,-450,900,900,56);g.fill();g.shadowColor='transparent';
  g.save();rr(g,-450,-450,900,900,56);g.clip();photo(g,S.photo,-450,-450,900,900,lp(1.0,1.22,eio(P(u,0,d))),0,0);g.restore();g.restore();
  big(g,S.t1.toUpperCase(),CX,1250,fg,u-.4,{size:200,fit:900,gap:.05});if(S.t2)big(g,S.t2,CX,1400,acc,u-.6,{size:130,fit:900,gap:.03});
  if(S.graphic==='slope'){const sl1=[[90,1700],[520,1560]],sl2=[[560,1780],[990,1480]];
    [[sl1,.9,C[(S.v+3)%5]],[sl2,1.05,acc]].forEach(([s,t0,c],i)=>{drawOn(g,s,ex(P(u,t0-.3,.4)),fg,14,1);
      const q=eio(P(u,t0+.1+i*.1,.8)),bx=lp(s[1][0],s[0][0],q),by=lp(s[1][1],s[0][1],q)-34;
      if(u>t0){g.save();g.translate(bx,by);g.rotate(-q*18);g.fillStyle=rgb(c);g.beginPath();g.arc(0,0,30,0,TAU);g.fill();g.fillStyle=rgb(PAPER);g.fillRect(-4,-30,8,22);g.restore()}})}
  else{for(let i=0;i<5;i++){const q=stg(u,i,.07,.4);g.fillStyle=rgb(C[(i+S.v)%5]);g.beginPath();g.arc(120+i*210,1700,34*q,0,TAU);g.fill()}}
  if(S.foot)T(g,S.foot,F(800,44),CX,1855,fg,ex(P(u,1.2,.4)))}};
SC.fold=S=>{return (g,t,u)=>{fillAll(g,INK);blobs(g,t,INK,[C[2],C[0],C[3]],.7);
  const p=eio(P(u,.35,.9)),ang=lp(.62,1.5,p),L=420,ax=CX,ay=lp(760,980,p),sx=Math.cos(ang)*L,sy=Math.sin(ang)*L;
  g.save();g.lineCap='round';g.lineJoin='round';g.strokeStyle=rgb(C[1]);g.lineWidth=46;g.beginPath();g.moveTo(ax,ay);g.lineTo(ax-sx,ay+sy);g.stroke();
  g.strokeStyle=rgb(C[0]);g.beginPath();g.moveTo(ax,ay);g.lineTo(ax+sx,ay+sy);g.stroke();
  g.strokeStyle=rgb(PAPER);g.lineWidth=12;for(let k=1;k<6;k++){const f=k/6.5;g.beginPath();g.moveTo(ax-sx*f,ay+sy*f-8*(1-p));g.lineTo(ax-sx*f,ay+sy*f+8*(1-p));g.stroke()}
  g.fillStyle=rgb(PAPER);g.beginPath();g.arc(ax,ay,34,0,TAU);g.fill();g.restore();
  big(g,S.t1.toUpperCase(),CX,330,PAPER,u,{size:260,fit:900,gap:.045});big(g,S.t2,CX,520,C[1],u-.25,{size:150,fit:700,gap:.04});
  const cr=lp(0,300,spr(P(u,.9,.6),6,9));g.save();g.beginPath();g.arc(CX,1450,cr,0,TAU);g.clip();photo(g,S.photo,CX-310,1140,620,620,lp(1.1,1.0,P(u,.9,1)),0,0);g.restore();ring(g,CX,1450,cr+16,PAPER,1,8);
  if(S.foot)T(g,S.foot,F(800,52),CX,1830,PAPER,ex(P(u,1.3,.4)))}};
SC.grid=S=>{const K=S.photos;return (g,t,u)=>{fillAll(g,PAPER);
  const pos=[[0,0],[540,0],[0,960],[540,960]],from=[[-700,0],[700,0],[-700,0],[700,0]];
  const z=1+.07*eo(P(u,.2,1.8));g.save();g.translate(CX,CY);g.scale(z,z);g.translate(-CX,-CY);
  K.slice(0,4).forEach((k,i)=>{const q=ex(P(u,i*.1,.45)),x=pos[i][0]+from[i][0]*(1-q),y=pos[i][1]+(i<2?-1:1)*600*(1-q);
    g.save();g.translate(x+270,y+480);g.rotate((1-q)*(i%2?.2:-.2));g.translate(-270,-480);photo(g,k,0,0,540,960,lp(1.15,1.0,eo(P(u,i*.1,1.6))),(i%2?-.2:.2),0);g.restore()});g.restore();
  const b=ex(P(u,.5,.45)),bc=C[S.v%5];g.save();g.translate(CX,CY);g.rotate(S.v%2?.1:-.1);g.fillStyle=rgb(bc);g.shadowColor='rgba(0,0,0,.35)';g.shadowBlur=30;g.fillRect(-W*.8*b,-150,W*1.6*b,300);g.shadowColor='transparent';
  if(b>.5){T(g,S.l1,F(900,S.s1||96),0,-12,onC(bc),1);T(g,S.l2,F(900,S.s1||96),0,92,dark(bc)?C[1]:PAPER,1)}g.restore()}};
SC.text=S=>{const bg=C[S.v%5],fg=onC(bg);return (g,t,u)=>{fillAll(g,bg);blobs(g,t,bg,[C[(S.v+1)%5],C[(S.v+3)%5]],.5);
  S.lines.forEach((l,i)=>big(g,l,CX+(i%2?60:-60),600+i*300,i%2?(dark(bg)?C[1]:mixc(INK,C[0],.55)):fg,u-i*.18,{size:260,fit:920,gap:.04}));
  if(S.photo){const cr=lp(0,260,spr(P(u,.7,.6),6,9));g.save();g.beginPath();g.arc(CX,1560,cr,0,TAU);g.clip();photo(g,S.photo,CX-300,1260,600,600,lp(1.2,1,P(u,.7,1)),0,0);g.restore();ring(g,CX,1560,cr+14,fg,1,8)}}};
SC.end=S=>{return (g,t,u)=>{fillAll(g,INK);blobs(g,t,INK,[C[2],C[0],C[3]],.5+1.6*Math.exp(-4*u));confetti(g,t,26,SPEC.seed,C,300);
  const c=spr(P(u,0,.7),6,9),br=1+.015*Math.sin(u*3);
  g.save();g.translate(CX,700);g.scale(c*br,c*br);g.rotate((1-c)*-.4);g.shadowColor='rgba(0,0,0,.4)';g.shadowBlur=50;g.shadowOffsetY=24;g.fillStyle='#fff';rr(g,-400,-400,800,800,60);g.fill();g.shadowColor='transparent';
  g.save();rr(g,-400,-400,800,800,60);g.clip();photo(g,S.photo,-400,-400,800,800,1.04+.05*u/3,0,0);g.restore();g.restore();
  big(g,'Hellurei',CX,1240,PAPER,u-.3,{size:230,fit:900,gap:.05});
  const pu=spr(P(u,.9,.5),7,10);if(pu>0){const w=640*pu;g.fillStyle=rgb(C[1]);rr(g,CX-w/2,1350,w,130,65);g.fill();if(pu>.6)T(g,'hellurei.fi',F(900,76),CX,1440,INK,1);
    const sw=P(u,1.6,.7);if(sw>0&&sw<1){g.save();rr(g,CX-w/2,1350,w,130,65);g.clip();g.fillStyle='rgba(255,255,255,.6)';g.save();g.translate(lp(CX-400,CX+400,sw),1415);g.rotate(.4);g.fillRect(-25,-120,50,240);g.restore();g.restore()}}
  const a=ex(P(u,1.2,.5));if(S.search)T(g,S.search,F(800,42),CX,1570+(1-a)*40,PAPER,a);if(S.note)T(g,S.note,F(600,34),CX,1650,MUTE,ex(P(u,1.5,.5)))}};

window.ready=(async()=>{await Promise.all([loadImgs,fonts]);
const shots=SPEC.scenes.map(S=>[S.a,S.b,SC[S.type](S),{bloom:S.bloom??.12}]);
K.start({duration:SPEC.duration,hud:{show:false},fade:{in:.04,out:.4},shots,hits:SPEC.hits});
return window.ready})();
</script></body></html>
